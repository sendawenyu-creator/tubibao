  const saleV=D.all.map(r=>r[0]),adsV=D.all.map(r=>r[1]),profV=D.all.map(r=>r[3]),acosV=D.all.map(r=>r[5]);
  mkOvChart('ch-sale',saleV,false,false,'#4fa3e0');
  mkOvChart('ch-ads', adsV, false,false,'#f07060');
  mkOvChart('ch-profit',profV,true,false,'#3fb950');
  mkOvChart('ch-acos',acosV,false,true,'#e8943a');
  const ff=v=>Math.round(v).toLocaleString('zh'),fp=v=>(v>=0?'+\u00a5':'-\u00a5')+ff(Math.abs(v));
  document.getElementById('cv-sale').textContent='\u00a5'+ff(saleV[LW]);
  document.getElementById('cv-ads').textContent='\u00a5'+ff(adsV[LW]);
  const pv=profV[LW];
  document.getElementById('cv-profit').textContent=fp(pv);
  document.getElementById('cv-profit').style.color=pv>=0?'var(--gr)':'var(--rd)';
  document.getElementById('cv-acos').textContent=acosV[LW].toFixed(1)+'%';
}

function renderSum(ss){
  const CW=WKS[LW],PW=WKS[LW-1];
  let cQty=0,cSa=0,cAd=0,cAr=0,cPr=0,hQty=0,hSa=0,hAd=0,hAr=0,hPr=0,pSa=0,pAd=0,pAr=0,pPr=0;
  ss.forEach(s=>Object.values(RAW[s]||{}).forEach(ws=>ws.forEach(w=>{
    if(w['\u5468\u671f']===CW){cQty+=w['\u9500\u91cf'];cSa+=w['\u9500\u552e\u989d'];cAd+=w['\u5e7f\u544a\u82b1\u8d39'];cAr+=w['\u5e7f\u544a\u9500\u552e\u989d'];cPr+=w['\u7ed3\u7b97\u6bdb\u5229\u6da6'];}
    else{hQty+=w['\u9500\u91cf'];hSa+=w['\u9500\u552e\u989d'];hAd+=w['\u5e7f\u544a\u82b1\u8d39'];hAr+=w['\u5e7f\u544a\u9500\u552e\u989d'];hPr+=w['\u7ed3\u7b97\u6bdb\u5229\u6da6'];}
    if(w['\u5468\u671f']===PW){pSa+=w['\u9500\u552e\u989d'];pAd+=w['\u5e7f\u544a\u82b1\u8d39'];pAr+=w['\u5e7f\u544a\u9500\u552e\u989d'];pPr+=w['\u7ed3\u7b97\u6bdb\u5229\u6da6'];}
  })));
  const cR=cAd>0?(cAr/cAd).toFixed(2):'\u2014',cA=cAr>0?(cAd/cAr*100).toFixed(1)+'%':'\u2014';
  const hR=hAd>0?(hAr/hAd).toFixed(2):'\u2014',hA=hAr>0?(hAd/hAr*100).toFixed(1)+'%':'\u2014';
  const f=v=>v.toLocaleString('zh',{maximumFractionDigits:0}),fp=v=>(v>=0?'+\u00a5':'-\u00a5')+f(Math.abs(v));
  function wow(c,p){if(!p)return '';const pct=(c-p)/p*100,col=pct>=0?'#3fb950':'#f07060';
    return '<span style="font-size:10px;color:'+col+';margin-left:4px">'+(pct>=0?'\u25b2':'\u25bc')+Math.abs(pct).toFixed(1)+'%</span>';}
  const N=LW+1,H=LW;
  const cards=[
    {l:'\u9500\u91cf',cV:f(cQty)+wow(cQty,0),hV:f(hQty),cC:'var(--bl2)',hC:'#3a6080',ca:'#4fa3e0'},
    {l:'\u9500\u552e\u989d',cV:'\u00a5'+f(cSa)+wow(cSa,pSa),hV:'\u00a5'+f(hSa),cC:'var(--gr)',hC:'#2a6040',ca:'#38a060'},
    {l:'\u5e7f\u544a\u82b1\u8d39',cV:'\u00a5'+f(cAd)+wow(cAd,pAd),hV:'\u00a5'+f(hAd),cC:'var(--rd)',hC:'#803030',ca:'#c05040'},
    {l:'\u5e7f\u544a\u9500\u552e\u989d',cV:'\u00a5'+f(cAr)+wow(cAr,pAr),hV:'\u00a5'+f(hAr),cC:'var(--pu)',hC:'#503080',ca:'#8060c0'},
    {l:'ROAS',cV:cR+'x',hV:hR+'x',cC:'var(--or)',hC:'#805020',ca:'#c06820'},
    {l:'ACOS',cV:cA,hV:hA,cC:'var(--or2)',hC:'#806030',ca:'#c07820'},
    {l:'\u7ed3\u7b97\u6bdb\u5229\u6da6',cV:fp(cPr)+wow(cPr,pPr),hV:fp(hPr),
      cC:cPr>=0?'var(--gr)':'var(--rd)',hC:hPr>=0?'#2a6040':'#803030',ca:cPr>=0?'#28804a':'#a04030'},
  ];
  document.getElementById('sum').innerHTML=cards.map(x=>`
    <div class="sc" style="--ca:${x.ca}">
      <div class="sc-l">${x.l}</div>
      <div class="sc-row">
        <div class="sc-half"><div class="sc-sub">W${N}当周</div><div class="sc-v" style="color:${x.cC}">${x.cV}</div></div>
        <div class="sc-div"></div>
        <div class="sc-half"><div class="sc-sub">W1~W${H}累计</div><div class="sc-v2" style="color:${x.hC}">${x.hV}</div></div>
      </div>
    </div>`).join('');
  document.getElementById('h-sale').textContent='W'+N+' \u9500\u552e\u989d \u00a5'+f(cSa);
  document.getElementById('h-profit').textContent='\u6bdb\u5229\u6da6 '+fp(cPr);
  document.getElementById('h-roas').textContent='ROAS '+cR+'x';
}

function renderBanner(){
  const b=document.getElementById('ab');if(!AN.length){b.style.display='none';return;}
  const drops=AN.filter(a=>!a.issues.join('').match(/\u6062\u590d|ACOS|\u6bdb\u5229\u6da6\u5f02\u5e38|\u8ba2\u5355\u6bdb\u5229/));
  const acos=AN.filter(a=>a.issues.join('').includes('ACOS'));
  const margin=AN.filter(a=>a.issues.join('').match(/\u8ba2\u5355\u6bdb\u5229/));
  const profit=AN.filter(a=>a.issues.join('').includes('\u6bdb\u5229\u6da6\u5f02\u5e38'));
  const oks=AN.filter(a=>a.issues.join('').includes('\u6062\u590d'));
  function chip(a,cls){const tip=a.issues.join(' | ').replace(/"/g,'&quot;');
    return '<div class="chip '+cls+'" onclick="jump(\''+a.store+'\',\''+a.product+'\')" title="'+tip+'">'+a.store+'\u00b7'+a.product+'</div>';}
  b.innerHTML='<div class="ab-t">W17 \u5f02\u5e38\u68c0\u6d4b ('+AN.length+')</div>'
    +'<div class="ab-chips">'
    +drops.map(a=>chip(a,'')).join('')+acos.map(a=>chip(a,'acos')).join('')
    +margin.map(a=>chip(a,'margin')).join('')
    +profit.map(a=>chip(a,'profit')).join('')+oks.map(a=>chip(a,'ok')).join('')+'</div>';
}

function draw(id,dsets,yFmt,opts){
  kill(id);const ctx=document.getElementById(id);if(!ctx)return;
  opts=opts||{};const hasNeg=dsets.some(d=>d.data.some(v=>v<0));
  const sc={x:{grid:{color:'rgba(36,48,64,.55)'},ticks:{color:'#3a5060',font:{size:9},maxRotation:0}}};
  if(opts.combo){
    sc.yA={type:'linear',position:'left',grid:{color:'rgba(36,48,64,.55)'},
      ticks:{color:'#b07020',font:{size:8},maxTicksLimit:5,callback:v=>Math.abs(v)>999?'\u00a5'+Math.round(v/1000)+'k':'\u00a5'+Math.round(v)},suggestedMin:0};
    sc.yP={type:'linear',position:'right',grid:{drawOnChartArea:false},
      ticks:{color:'#6a7a80',font:{size:8},maxTicksLimit:5,callback:v=>v.toFixed(0)+'%'},suggestedMin:0};
  }else{
    sc.y={grid:{color:'rgba(36,48,64,.55)'},ticks:{color:'#3a5060',font:{size:9},maxTicksLimit:5,callback:v=>yFmt(v)},suggestedMin:hasNeg?undefined:0};
  }
  CI[id]=new Chart(ctx,{type:'bar',data:{labels:WS,datasets:dsets},options:{
    responsive:true,maintainAspectRatio:false,animation:{duration:200},
    plugins:{legend:{display:dsets.length>1,position:'top',labels:{color:'#5a7080',font:{size:9},boxWidth:8,padding:6}},
      tooltip:{backgroundColor:'#161d27',borderColor:'#243040',borderWidth:1,titleColor:'#d0dae8',bodyColor:'#5a7080',padding:10,
        callbacks:{title:i=>WKS[i[0].dataIndex],label:i=>' '+i.dataset.label+': '+fv(i.raw,i.dataset._k)}},
      barLabels:{}},scales:sc}});
}

function adDS(ads,acos,acoas,asoas){
  return[
    {type:'bar',label:'\u5e7f\u544a\u82b1\u8d39',data:ads,
      backgroundColor:ads.map((_,i)=>i===LW?'rgba(232,148,58,.92)':'rgba(232,148,58,.38)'),
      borderRadius:3,yAxisID:'yA',_k:'\u5e7f\u544a\u82b1\u8d39',_fmt:v=>Math.abs(v)>999?'\u00a5'+Math.round(v/1000)+'k':'\u00a5'+Math.round(v)},
    {type:'line',label:'ACOS%',data:acos,borderColor:'#e8943a',borderWidth:2,pointRadius:3,
      pointBackgroundColor:'#e8943a',tension:.35,yAxisID:'yP',_k:'ACOS',fill:false,_noLabel:true},
    {type:'line',label:'ACoAS%',data:acoas,borderColor:'#a06010',borderWidth:1.5,pointRadius:2,
      tension:.35,yAxisID:'yP',_k:'ACoAS',borderDash:[5,3],fill:false,_noLabel:true},
    {type:'line',label:'ASoAS%',data:asoas,borderColor:'#f5b060',borderWidth:1.5,pointRadius:2,
      tension:.35,yAxisID:'yP',_k:'ASoAS',borderDash:[2,4],fill:false,_noLabel:true},
  ];
}

function storeChart(el,store){
  const id='c_'+store.replace(/[^a-zA-Z0-9]/g,'_');el.querySelector('canvas').id=id;
  const prods=Object.keys(RAW[store]||{});let ds=[],yFmt=v=>v;
  const K={ads:'\u5e7f\u544a\u82b1\u8d39',adrev:'\u5e7f\u544a\u9500\u552e\u989d',sale:'\u9500\u552e\u989d'};
  if(TY==='combo'){
    ds=adDS(WKS.map(w=>sws(store,w,K.ads)),
      WKS.map(w=>{const a=sws(store,w,K.ads),b=sws(store,w,K.adrev);return b>0?a/b*100:0}),
      WKS.map(w=>{const a=sws(store,w,K.ads),b=sws(store,w,K.sale);return b>0?a/b*100:0}),
      WKS.map(w=>{const a=sws(store,w,K.adrev),b=sws(store,w,K.sale);return b>0?a/b*100:0}));
    const tot=WKS.reduce((a,w)=>a+sws(store,w,K.ads),0);
    el.querySelector('.cn').textContent=store;el.querySelector('.cn').style.color=SC[store]||'#e8f4ff';
    el.querySelector('.cm').innerHTML='<strong style="color:var(--or)">\u00a5'+Math.round(tot).toLocaleString('zh')+'</strong>\u00b7'+prods.length+'\u54c1\u540d';
    draw(id,ds,null,{combo:true});return;
  }else if(TY==='multi'){
    const md=MT==='RET_GRP'?MDEF.RET:MDEF.FBA;
    md.keys.forEach((k,i)=>ds.push({label:md.lbs[i],data:WKS.map(w=>sws(store,w,k)),
      backgroundColor:WKS.map((_,wi)=>wi===LW?md.cols[i]:md.cols[i]+'55'),borderRadius:3,_k:k,_fmt:mkFmt(k)}));
    yFmt=v=>Math.round(v);
  }else{
    const base=SC[store]||'#4fa3e0',vals=WKS.map(w=>sws(store,w,MT));
    const isP=TY==='profit',isR=TY==='rate';
    ds=[{label:MT,data:vals,backgroundColor:vals.map((v,i)=>bc(v,MT)||(i===LW?base:base+'66')),
      borderRadius:4,_k:MT,_isProfit:isP,_isRate:isR,_fmt:mkFmt(MT)}];
    if(TY==='rate')yFmt=v=>v.toFixed(0)+'%';
    else if(TY==='money')yFmt=v=>'\u00a5'+Math.round(Math.abs(v/1000))+'k';
    else if(TY==='profit')yFmt=v=>(v>=0?'+':'-')+'\u00a5'+Math.abs(v/1000).toFixed(0)+'k';
    else yFmt=v=>Math.round(v);
  }
  const tot=TY==='multi'?null:WKS.reduce((a,w)=>a+sws(store,w,MT),0);
  const ts=tot===null?'\u2014':fv(tot,MT),tc=TY==='profit'?(tot>=0?'#3fb950':'#f07060'):'var(--bl)';
  el.querySelector('.cn').textContent=store;el.querySelector('.cn').style.color=SC[store]||'#e8f4ff';
  el.querySelector('.cm').innerHTML='<strong style="color:'+tc+'">'+ts+'</strong><span style="color:var(--di)">\u00b7</span>'+prods.length+'\u54c1\u540d<span class="tag">'+(store.endsWith('-CA')?'CA':'US')+'</span>';
  draw(id,ds,yFmt);
}

function prodChart(el,prod,sl){
  const id='c_'+prod.replace(/[^a-zA-Z0-9]/g,'_')+'_p';el.querySelector('canvas').id=id;
  const at=sl.some(s=>getAn(s,prod))?anType(sl.find(s=>getAn(s,prod)),prod):null;
  let ds=[],yFmt=v=>v;
  const K={ads:'\u5e7f\u544a\u82b1\u8d39',adrev:'\u5e7f\u544a\u9500\u552e\u989d',sale:'\u9500\u552e\u989d'};
  if(TY==='combo'){
    const ga=k=>WKS.map(w=>sl.reduce((a,s)=>a+wv(s,prod,w,k),0));
    const ad=ga(K.ads),ar=ga(K.adrev),sa=ga(K.sale);
    ds=adDS(ad,WKS.map((_,i)=>ar[i]>0?ad[i]/ar[i]*100:0),
      WKS.map((_,i)=>sa[i]>0?ad[i]/sa[i]*100:0),WKS.map((_,i)=>sa[i]>0?ar[i]/sa[i]*100:0));
    const tot=ad.reduce((a,v)=>a+v,0);
    el.querySelector('.cn').textContent=prod;
    if(at)el.querySelector('.cn').style.color=at==='ok'?'var(--gr2)':at==='acos'?'var(--or2)':at==='margin'?'#ff9090':at==='profit'?'#c0a8ff':'var(--rd2)';
    el.querySelector('.cm').innerHTML='<strong style="color:var(--or)">\u00a5'+Math.round(tot).toLocaleString('zh')+'</strong>\u00b7'+sl.length+'\u5e97\u94fa';
    draw(id,ds,null,{combo:true});return;
  }else if(TY==='multi'){
    const md=MT==='RET_GRP'?MDEF.RET:MDEF.FBA;
    sl.forEach(s=>md.keys.forEach((k,ki)=>ds.push({label:s+'\u00b7'+md.lbs[ki],
      data:WKS.map(w=>wv(s,prod,w,k)),
      backgroundColor:WKS.map((_,wi)=>wi===LW?md.cols[ki]:md.cols[ki]+'55'),borderRadius:3,_k:k,_fmt:mkFmt(k)})));
    yFmt=v=>Math.round(v);
  }else{
    const isP=TY==='profit',isR=TY==='rate';
    sl.forEach(s=>{const base=SC[s]||'#4fa3e0';
      ds.push({label:s,data:WKS.map(w=>wv(s,prod,w,MT)),
        backgroundColor:WKS.map((_,wi)=>wi===LW?base:base+'66'),
        borderRadius:4,_k:MT,_isProfit:isP,_isRate:isR,_fmt:mkFmt(MT)});});
    if(TY==='rate')yFmt=v=>v.toFixed(0)+'%';
    else if(TY==='money')yFmt=v=>'\u00a5'+Math.abs(v/1000).toFixed(0)+'k';
    else if(TY==='profit')yFmt=v=>(v>=0?'+':'-')+'\u00a5'+Math.abs(v/1000).toFixed(0)+'k';
    else yFmt=v=>Math.round(v);
  }
  const tot=TY==='multi'?null:sl.reduce((a,s)=>a+WKS.reduce((b,w)=>b+wv(s,prod,w,MT),0),0);
  const ts=tot===null?'\u2014':fv(tot,MT),tc=TY==='profit'?(tot>=0?'#3fb950':'#f07060'):'var(--bl)';
  el.querySelector('.cn').textContent=prod;
  if(at)el.querySelector('.cn').style.color=at==='ok'?'var(--gr2)':at==='acos'?'var(--or2)':at==='margin'?'#ff9090':at==='profit'?'#c0a8ff':'var(--rd2)';
  el.querySelector('.cm').innerHTML='<strong style="color:'+tc+'">'+ts+'</strong><span style="color:var(--di)">\u00b7</span>'+sl.length+'\u5e97\u94fa';
  draw(id,ds,yFmt);
}

function mkCard(cid){
  const d=document.createElement('div');d.className='cc';if(cid)d.id=cid;
  d.innerHTML='<div class="cn"></div><div class="cm"></div><div class="wrap"><canvas></canvas></div>';
  return d;
}
function jump(s,p){
  if(DIM==='store'){DIM='product';document.querySelectorAll('.dt').forEach(b=>b.classList.toggle('act',b.dataset.d==='product'));render();}
  const id='cc_'+s.replace(/[^a-zA-Z0-9]/g,'_')+'_'+p.replace(/[^a-zA-Z0-9]/g,'_');
  setTimeout(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
    el.style.boxShadow='0 0 0 2px rgba(240,112,96,.8)';setTimeout(()=>el.style.boxShadow='',2000);}},350);
}

function render(){
  const ss=actSt();renderSum(ss);
  Object.keys(CI).filter(id=>!['ch-sale','ch-ads','ch-profit','ch-acos'].includes(id))
    .forEach(id=>{try{CI[id].destroy()}catch(e){}delete CI[id]});
  document.getElementById('main').innerHTML='';
  const main=document.getElementById('main'),jobs=[];
  if(DIM==='store'){
    const h=document.createElement('div');h.className='sh';
    h.innerHTML='<div class="st">// \u6309\u5e97\u94fa \u00b7 \u54c1\u540d\u6c47\u603b\u8d8b\u52bf</div><div class="sb2">'+ss.length+' STORES \u00b7 17 WEEKS \u00b7 W17\u67f1\u52a0\u6df1</div>';
    main.appendChild(h);const g=document.createElement('div');g.className='grid';
    ss.forEach(s=>{const c=mkCard();g.appendChild(c);jobs.push(()=>storeChart(c,s));});
    main.appendChild(g);
  }else{
    let ps=aPs(ss);
    if(ZF==='hide')ps=ps.filter(p=>ss.some(s=>RAW[s]&&RAW[s][p]&&RAW[s][p].some(w=>w['\u9500\u91cf']>0)));
    if(AF==='anom')ps=ps.filter(p=>ss.some(s=>getAn(s,p)));
    document.getElementById('bprods').textContent=ps.length+' \u54c1\u540d';
    const h=document.createElement('div');h.className='sh';
    h.innerHTML='<div class="st">// \u6309\u54c1\u540d \u00b7 \u4e24\u5e97\u5bf9\u6bd4</div><div class="sb2">'+ps.length+' PRODUCTS \u00b7 W17\u67f1\u52a0\u6df1</div>';
    main.appendChild(h);const g=document.createElement('div');g.className='grid';
    ps.forEach(p=>{
      const vs=ss.filter(s=>RAW[s]&&RAW[s][p]);if(!vs.length)return;
      const anSt=vs.filter(s=>getAn(s,p));
      const at=anSt.length?anType(anSt[0],p):null;
      const cid='cc_'+vs[0].replace(/[^a-zA-Z0-9]/g,'_')+'_'+p.replace(/[^a-zA-Z0-9]/g,'_');
      const c=mkCard(cid);
      if(at){c.classList.add('a-'+at);const a=getAn(anSt[0],p);
        const badge=document.createElement('div');badge.className='an-b '+at;badge.title=a.issues.join(' | ');
        badge.textContent=(at==='ok'?'\u2191 ':at==='acos'?'\u25c8 ':at==='margin'?'\u25bc\u00a5 ':at==='profit'?'\u2191\u00a5 ':'\u2193 ')+a.issues[0].substring(0,22);
        c.appendChild(badge);}
      g.appendChild(c);jobs.push(()=>prodChart(c,p,vs));
    });
    main.appendChild(g);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>jobs.forEach(fn=>fn())));
}

(function(){
  const sel=document.getElementById('ss');
  aSt().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)});
  document.querySelectorAll('.mt').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.mt').forEach(x=>x.classList.remove('act'));b.classList.add('act');MT=b.dataset.m;TY=b.dataset.t;render();
  }));
  document.querySelectorAll('.dt').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.dt').forEach(x=>x.classList.remove('act'));b.classList.add('act');DIM=b.dataset.d;render();
  }));
  document.getElementById('ss').addEventListener('change',e=>{SF=e.target.value;render()});
  document.getElementById('sz').addEventListener('change',e=>{ZF=e.target.value;render()});
  document.getElementById('sa').addEventListener('change',e=>{AF=e.target.value;render()});
  renderBanner();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{render();renderOverview();}));
})();

</script>
